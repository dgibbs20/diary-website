<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 1024px; overflow: hidden; background: #F7F0E6; }
 
  .card {
    width: 1024px;
    height: 1024px;
    background: #F7F0E6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
 
  /* Subtle texture overlay */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(217,178,108,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(138,90,60,0.08) 0%, transparent 50%);
  }
 
  /* Top decorative border */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #8A5A3C, #D9B26C, #8A5A3C);
  }
 
  /* Corner ornaments */
  .corner {
    position: absolute;
    width: 60px;
    height: 60px;
    border-color: rgba(217,178,108,0.4);
    border-style: solid;
  }
  .corner.tl { top: 32px; left: 32px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 32px; right: 32px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 32px; left: 32px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 32px; right: 32px; border-width: 0 1px 1px 0; }
 
  .inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
 
  .wordmark {
    font-size: 72px;
    font-weight: 300;
    color: #D9B26C;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }
  .wordmark em { font-style: italic; }
 
  .divider-top {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #D9B26C, transparent);
    margin-bottom: 40px;
  }
 
  .tier-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #8A5A3C;
    font-family: -apple-system, sans-serif;
    margin-bottom: 24px;
  }
 
  .plan-name {
    font-size: 88px;
    font-weight: 300;
    font-style: italic;
    color: #3F3024;
    line-height: 1;
    margin-bottom: 48px;
  }
 
  .price-wrap {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    margin-bottom: 16px;
  }
  .currency {
    font-size: 36px;
    font-weight: 400;
    color: #D9B26C;
    margin-top: 14px;
  }
  .amount {
    font-size: 120px;
    font-weight: 300;
    color: #3F3024;
    line-height: 1;
  }
  .period {
    font-size: 28px;
    font-weight: 400;
    color: #7B6A58;
    align-self: flex-end;
    margin-bottom: 18px;
    font-style: italic;
  }
 
  .divider-mid {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #D9B26C, transparent);
    margin: 32px 0;
  }
 
  .tagline {
    font-size: 32px;
    font-weight: 300;
    font-style: italic;
    color: #7B6A58;
    margin-bottom: 40px;
  }
 
  .features {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .feature {
    font-size: 22px;
    font-weight: 400;
    color: #7B6A58;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: -apple-system, sans-serif;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #D9B26C;
  }
 
  .badge {
    position: absolute;
    bottom: 64px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8A5A3C;
    font-family: -apple-system, sans-serif;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
 
  <div class="inner">
    <img src="https://diary.gmxquantum.com/logo-transparent2.png" alt="diAry" height="145" style="display:block;" />
    <div class="divider-top"></div>
    <div class="tier-label">Elite Membership</div>
    <div class="plan-name">Monthly</div>
    <div class="price-wrap">
      <span class="currency">$</span>
      <span class="amount">9</span>
      <span class="period">.99 / mo</span>
    </div>
    <div class="divider-mid"></div>
    <div class="tagline">Start your journey today</div>
    <div class="features">
      <div class="feature"><span class="dot"></span> Unlimited AI Companion Access</div>
      <div class="feature"><span class="dot"></span> Voice, Text & Handwritten Journals</div>
      <div class="feature"><span class="dot"></span> Advanced Analytics & Insights</div>
      <div class="feature"><span class="dot"></span> Cancel Anytime</div>
    </div>
  </div>
 
  <div class="badge">GMX Quantum LLC</div>
</div>
</body>
</html>
